<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Xbox 3D Sandbox Engine Build</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
        #hud {
            position: absolute; top: 25px; left: 25px; color: #00ffcc; font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold;
            text-shadow: 2px 2px 3px #000; pointer-events: none; background: rgba(2, 8, 12, 0.9); padding: 22px; border-radius: 10px; border: 2px solid #00ffcc;
        }
        .hud-line { margin-bottom: 6px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #ff3333; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
    </style>
    <!-- Core BabylonJS Libraries loaded via official CDN -->
    <script src="https://babylonjs.com"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">
        <div class="hud-line">CASH: $<span id="hud-cash">5000</span> | BANK: $<span id="hud-biz-bank">15000</span></div>
        <div class="hud-line">STOCK: <span id="hud-stock">100</span>/500 oz</div>
        <div class="hud-line">WEAPON: <span id="hud-weapon">UNARMED</span> [<span id="hud-ammo">0</span> AMMO]</div>
        <div class="hud-line">MISSION: <span id="hud-mission">NONE</span></div>
        <div class="hud-line">WANTED LEVEL: <span id="hud-stars">CLEAR</span></div>
        <div class="hud-line">TIME: <span id="hud-time">08:00</span> [<span id="hud-weather">CLEAR</span>]</div>
        <div class="hud-line">PERFORMANCE: <span id="hud-fps">0</span> FPS</div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
    // --- Fail-safe Sandboxed Storage System ---
    class SaveSystem {
        static save(data) {
            try { localStorage.setItem("XBOX_3D_SANDBOX_SAVE_DATA", JSON.stringify(data)); } catch (e) {}
        }
        static load() {
            try { const d = localStorage.getItem("XBOX_3D_SANDBOX_SAVE_DATA"); return d ? JSON.parse(d) : null; } catch(e) { return null; }
        }
    }

    // --- Hardened Xbox Controller API Layer ---
    class XboxInput {
        constructor() {
            this.gamepadIndex = null; this.deadzone = 0.20; this.axes = [0, 0, 0, 0];
            this.buttons = { A: false, B: false, X: false, Y: false, LT: 0, RT: 0, LB: false, RB: false, Menu: false };
            this.prevButtons = { ...this.buttons };
            window.addEventListener("gamepadconnected", (e) => { this.gamepadIndex = e.gamepad.index; });
        }
        poll() {
            if (this.gamepadIndex === null) {
                const gps = navigator.getGamepads();
                for (let i = 0; i < gps.length; i++) { if (gps[i]) { this.gamepadIndex = i; break; } }
            }
            if (this.gamepadIndex === null) return;
            const gp = navigator.getGamepads()[this.gamepadIndex]; if (!gp) return;
            this.prevButtons = { ...this.buttons };
            
            // Fixed mapping bounds verification loop
            if (gp.axes && gp.axes.length >= 2) {
                this.axes = [
                    Math.abs(gp.axes[0]) > this.deadzone ? gp.axes[0] : 0,
                    Math.abs(gp.axes[1]) > this.deadzone ? gp.axes[1] : 0
                ];
            }
            if (gp.buttons && gp.buttons.length >= 10) {
                this.buttons = {
                    A: gp.buttons[0].pressed, B: gp.buttons[1].pressed, X: gp.buttons[2].pressed, Y: gp.buttons[3].pressed,
                    LB: gp.buttons[4].pressed, RB: gp.buttons[5].pressed, LT: gp.buttons[6].value, RT: gp.buttons[7].value,
                    Menu: gp.buttons[9].pressed
                };
            }
        }
        wasButtonPressed(b) { return this.buttons[b] && !this.prevButtons[b]; }
    }

    class VehicleController {
        constructor(mesh, type = "Sports") {
            this.mesh = mesh; this.type = type; this.velocity = new BABYLON.Vector3.Zero(); this.speed = 0; this.heading = 0;
            this.maxSpeed = type === "Truck" ? 0.55 : 0.90;
            this.acceleration = type === "Truck" ? 0.01 : 0.025;
            this.deceleration = 0.007; this.brakingForce = 0.045; this.steeringSpeed = 0.048; this.driftFactor = type === "Truck" ? 0.97 : 0.91;
        }
        update(throttle, brake, steerX, isRainy) {
            const localizedDrift = Math.min(0.99, this.driftFactor + (isRainy ? 0.05 : 0));
            if (Math.abs(this.speed) > 0.03) { this.heading += steerX * this.steeringSpeed * (this.speed > 0 ? 1 : -1); this.mesh.rotation.y = this.heading; }
            if (throttle > 0.05) this.speed = Math.min(this.maxSpeed, this.speed + (throttle * this.acceleration));
            else if (brake > 0.05) this.speed = Math.max(-this.maxSpeed * 0.3, this.speed - (brake * this.brakingForce));
            else { if (this.speed > 0) this.speed = Math.max(0, this.speed - this.deceleration); if (this.speed < 0) this.speed = Math.min(0, this.speed + this.deceleration); }
            this.velocity = BABYLON.Vector3.Lerp(this.velocity, new BABYLON.Vector3(Math.sin(this.heading) * this.speed, 0, Math.cos(this.heading) * this.speed), localizedDrift);
            this.mesh.position.addInPlace(this.velocity);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('renderCanvas'); const engine = new BABYLON.Engine(canvas, true);
        let scene, camera, sunLight, shadowGen, input = new XboxInput(), activeVehicle;
        let playerMesh, sportsCarMesh, deliveryTruckMesh, stateMode = "Walking", timeOfDayClock = 8.0;
        let currentWeather = "CLEAR", rainParticles = null, activeMission = "NONE", missionStage = 0, missionMarker = null, payrollCounter = 0;
        let cash = 5000, bizBank = 15000, stock = 100, maxStock = 500, hasCouch = false, hasWeapon = false, ammo = 0, stars = 0, cooldown = 0;
        const nodes = [new BABYLON.Vector3(-150,0,-150), new BABYLON.Vector3(150,0,150), new BABYLON.Vector3(0,0,90)];
        let trafficCars = [], copCars = [];

        const initGame = () => {
            scene = new BABYLON.Scene(engine); scene.clearColor = new BABYLON.Color3(0.03, 0.03, 0.06);
            camera = new BABYLON.UniversalCamera("Cam", new BABYLON.Vector3(0, 25, -18), scene); camera.setTarget(BABYLON.Vector3.Zero());
            sunLight = new BABYLON.DirectionalLight("Sun", new BABYLON.Vector3(-0.5, -1, -0.4), scene); sunLight.position = new BABYLON.Vector3(50, 100, 50); sunLight.intensity = 2.0;
            const ambient = new BABYLON.HemisphericLight("Amb", new BABYLON.Vector3(0, 1, 0), scene); ambient.intensity = 0.4;
            shadowGen = new BABYLON.ShadowGenerator(1024, sunLight); shadowGen.useBlurExponentialShadowMap = true; shadowGen.blurKernel = 16;

            const slab = BABYLON.MeshBuilder.CreateGround("Floor", { width: 700, height: 700 }, scene);
            const sMat = new BABYLON.PBRMaterial("sMat", scene); sMat.albedoColor = new BABYLON.Color3(0.13, 0.13, 0.15); sMat.roughness = 0.85; slab.material = sMat; slab.receiveShadows = true;

            for (let x = -240; x <= 240; x += 80) {
                for (let z = -240; z <= 240; z += 80) {
                    if (Math.abs(x) < 50 && Math.abs(z) < 50) continue;
                    const h = 30 + Math.random() * 45;
                    const b = BABYLON.MeshBuilder.CreateBox("Bld", { width: 35, depth: 35, height: h }, scene); b.position = new BABYLON.Vector3(x, h / 2, z);
                    const bMat = new BABYLON.PBRMaterial("bMat", scene); bMat.albedoColor = new BABYLON.Color3(0.2, 0.24, 0.28); b.material = bMat; shadowGen.addShadowCaster(b);
                }
            }

            const hq = BABYLON.MeshBuilder.CreateBox("HQ", { width: 30, depth: 30, height: 8 }, scene); hq.position = new BABYLON.Vector3(0, 4, 0);
            const hqMat = new BABYLON.PBRMaterial("hqMat", scene); hqMat.albedoColor = new BABYLON.Color3(0.05, 0.3, 0.15); hq.material = hqMat; shadowGen.addShadowCaster(hq);
            const portal = BABYLON.MeshBuilder.CreateCylinder("Portal", { diameter: 3, height: 0.15 }, scene); portal.position = new BABYLON.Vector3(0, 0.08, -15.5);
            const mMat = new BABYLON.StandardMaterial("mMat", scene); mMat.emissiveColor = new BABYLON.Color3(0, 0.7, 0.3); portal.material = mMat;

            playerMesh = BABYLON.MeshBuilder.CreateCylinder("Player", { diameter: 1.3, height: 2.2 }, scene); playerMesh.position = new BABYLON.Vector3(0, 1.1, -20);
            const pMat = new BABYLON.PBRMaterial("pMat", scene); pMat.albedoColor = new BABYLON.Color3(0.9, 0.7, 0.1); playerMesh.material = pMat; shadowGen.addShadowCaster(playerMesh);

            sportsCarMesh = BABYLON.MeshBuilder.CreateBox("SportsCar", { width: 2.3, depth: 4.6, height: 1.4 }, scene); sportsCarMesh.position = new BABYLON.Vector3(12, 0.7, -22);
            const scMat = new BABYLON.PBRMaterial("scMat", scene); scMat.albedoColor = new BABYLON.Color3(0.05, 0.2, 0.85); sportsCarMesh.material = scMat; shadowGen.addShadowCaster(sportsCarMesh);
            deliveryTruckMesh = BABYLON.MeshBuilder.CreateBox("TruckMesh", { width: 2.8, depth: 6.5, height: 2.6 }, scene); deliveryTruckMesh.position = new BABYLON.Vector3(-15, 1.3, -25);
            const tMat = new BABYLON.PBRMaterial("tMat", scene); tMat.albedoColor = new BABYLON.Color3(0.3, 0.35, 0.35); deliveryTruckMesh.material = tMat; shadowGen.addShadowCaster(deliveryTruckMesh);
            activeVehicle = new VehicleController(sportsCarMesh, "Sports");

            for(let i=0; i<6; i++) {
Use code with caution.
let car = BABYLON.MeshBuilder.CreateBox("CivCar", {width:2, depth:4, height:1.5}, scene); car.position = new BABYLON.Vector3(Math.random()*200-100, 0.75, Math.random()*200-100);
let cMat = new BABYLON.StandardMaterial("c", scene); cMat.diffuseColor = new BABYLON.Color3(0.5,0.5,0.5); car.material = cMat; trafficCars.push(car);
}
for(let i=0; i<3; i++) {
let cop = BABYLON.MeshBuilder.CreateBox("CopCar", {width:2.2, depth:4.6, height:1.6}, scene); cop.position = new BABYLON.Vector3(200, 0.8, 200); cop.setEnabled(false);
let copMat = new BABYLON.StandardMaterial("cop", scene); copMat.diffuseColor = new BABYLON.Color3(0,0,0); cop.material = copMat; copCars.push({mesh:cop, active:false});
}
// Fixed procedural line generator replaces web tracking images to avoid asset blocks
rainParticles = new BABYLON.ParticleSystem("Rain", 100, scene);
rainParticles.emitter = new BABYLON.Vector3(0, 25, 0); rainParticles.minEmitBox = new BABYLON.Vector3(-30, 0, -30); rainParticles.maxEmitBox = new BABYLON.Vector3(30, 0, 30);
rainParticles.color1 = new BABYLON.Color4(0.6, 0.6, 0.8, 0.4); rainParticles.gravity = new BABYLON.Vector3(0, -20, 0); rainParticles.emitRate = 0; rainParticles.start();
};
const isInside = (pos) => { return (pos.x >= -15 && pos.x <= 15 && pos.z >= -15 && pos.z <= 15); };
initGame();
engine.runRenderLoop(() => {
input.poll();
timeOfDayClock = (timeOfDayClock + 0.002) % 24;
if (Math.random() < 0.001) { currentWeather = currentWeather === "CLEAR" ? "RAIN" : "CLEAR"; rainParticles.emitRate = currentWeather === "RAIN" ? 100 : 0; }
const currentPos = stateMode === "Driving" ? activeVehicle.mesh.position : playerMesh.position;
rainParticles.emitter.copyFrom(currentPos).addInPlace(new BABYLON.Vector3(0, 20, 0));
if (cooldown > 0) { cooldown--; if(cooldown===0 && stars>0) { stars--; if(stars>0) cooldown=600; else stateMode="Walking"; } }
copCars.forEach((cop, idx) => {
if(!cop.active && idx < stars) { cop.mesh.setEnabled(true); cop.active = true; cop.mesh.position.copyFrom(currentPos).addInPlace(new BABYLON.Vector3(0,0,70)); }
else if(cop.active && idx >= stars) { cop.mesh.setEnabled(false); cop.active = false; }
if(cop.active) {
let dir = currentPos.subtract(cop.mesh.position); dir.normalize();
cop.mesh.rotation.y = Math.atan2(dir.x, dir.z); cop.mesh.position.addInPlace(dir.scale(0.35));
if(stateMode === "Driving" && BABYLON.Vector3.Distance(cop.mesh.position, activeVehicle.mesh.position) < 3.5) { stars = Math.min(5, stars+1); cooldown=600; }
}
});
trafficCars.forEach(car => {
car.position.z += 0.15; if (car.position.z > 300) car.position.z = -300;
if(stateMode === "Driving" && BABYLON.Vector3.Distance(activeVehicle.mesh.position, car.position) < 4.0) { if(stars===0) { stars=1; cooldown=600; } }
});
payrollCounter++; if(payrollCounter >= 2000) { if(stateMode==="Interior" || isInside(playerMesh.position)) { if(stock>0) { stock--; bizBank += (hasCouch ? 80 : 65); } } payrollCounter=0; }
if (activeMission !== "NONE" && missionMarker) {
if (BABYLON.Vector3.Distance(currentPos, missionMarker.position) < 4.5) {
if (missionStage === 1) { missionStage = 2; missionMarker.position.copyFrom(new BABYLON.Vector3(0, 0.1, -15.5)); }
else if (missionStage === 2) { bizBank += 3500; stock = Math.min(500, stock + 75); activeMission = "NONE"; missionMarker.dispose(); missionMarker = null; }
}
}
if (input.wasButtonPressed("Y")) {
if (stateMode === "Walking") {
if (BABYLON.Vector3.Distance(playerMesh.position, sportsCarMesh.position) < 4.5) { stateMode = "Driving"; activeVehicle = new VehicleController(sportsCarMesh, "Sports"); playerMesh.setEnabled(false); }
else if (BABYLON.Vector3.Distance(playerMesh.position, deliveryTruckMesh.position) < 5.5) { stateMode = "Driving"; activeVehicle = new VehicleController(deliveryTruckMesh, "Truck"); playerMesh.setEnabled(false); }
} else if (stateMode === "Driving") { stateMode = "Walking"; playerMesh.position.copyFrom(activeVehicle.mesh.position).addInPlace(new BABYLON.Vector3(-3.5, 0.5, 0)); playerMesh.setEnabled(true); }
}
if (input.wasButtonPressed("LB")) { if (stateMode === "Walking" && hasWeapon) { stateMode = "Aiming"; document.getElementById("crosshair").style.display = "block"; } else if (stateMode === "Aiming") { stateMode = "Walking"; document.getElementById("crosshair").style.display = "none"; } }
if (input.wasButtonPressed("RB") && stateMode === "Aiming" && ammo > 0) {
ammo--; let ray = new BABYLON.Ray(playerMesh.position, playerMesh.forward, 50); let hit = scene.pickWithRay(ray);
if(hit && hit.pickedMesh && hit.pickedMesh.name.includes("CopCar")) { stars = Math.min(5, stars+1); cooldown=600; }
}
if (input.wasButtonPressed("X")) {
if (isInside(playerMesh.position) || stateMode === "Interior") { if(bizBank >= 400 && stock <= 460) { bizBank -= 400; stock += 40; } }
else if (stateMode === "Walking" && activeMission === "NONE") { activeMission = "DELIVERY RUN"; missionStage = 1; missionMarker = BABYLON.MeshBuilder.CreateCylinder("Marker", {diameter:4, height:0.2}, scene); missionMarker.position.copyFrom(nodes[Math.floor(Math.random()*nodes.length)]); let m = new BABYLON.StandardMaterial("m", scene); m.emissiveColor = new BABYLON.Color3(1,0,0); missionMarker.material = m; }
}
if (input.wasButtonPressed("A")) {
if (isInside(playerMesh.position) || stateMode === "Interior") {
if (!hasCouch && cash >= 1500) { cash -= 1500; hasCouch = true; let c = BABYLON.MeshBuilder.CreateBox("Couch", {width:6, depth:2, height:1.2}, scene); c.position = new BABYLON.Vector3(-6,0.6,6); }
else if (hasCouch && !hasWeapon && cash >= 1000) { cash -= 1000; hasWeapon = true; ammo = 100; let g = BABYLON.MeshBuilder.CreateBox("Bench", {width:3, depth:1.5, height:1.4}, scene); g.position = new BABYLON.Vector3(8,0.7,8); }
}
}
if (input.wasButtonPressed("Menu")) { SaveSystem.save({ cash, bizBank, stock, hasCouch, hasWeapon, ammo }); }
// Safe horizontal stick axes checking safeguards tracking loops
const horizontalAxisValue = (input.axes && input.axes[0]) ? input.axes[0] : 0;
const verticalAxisValue = (input.axes && input.axes[1]) ? input.axes[1] : 0;
if (stateMode === "Walking" || stateMode === "Aiming") {
playerMesh.position.x += horizontalAxisValue * 0.15; playerMesh.position.z += -verticalAxisValue * 0.15;
camera.position.x = playerMesh.position.x; camera.position.z = playerMesh.position.z - 15;
if (isInside(playerMesh.position)) stateMode = "Interior";
} else if (stateMode === "Interior") {
playerMesh.position.x += horizontalAxisValue * 0.11; playerMesh.position.z += -verticalAxisValue * 0.11;
camera.position.x = playerMesh.position.x; camera.position.z = playerMesh.position.z - 15;
if (!isInside(playerMesh.position)) stateMode = "Walking";
} else if (stateMode === "Driving") {
activeVehicle.update(input.buttons.RT, input.buttons.LT, horizontalAxisValue, currentWeather === "RAIN");
camera.position.x = activeVehicle.mesh.position.x; camera.position.z = activeVehicle.mesh.position.z - 19;
}
document.getElementById("hud-cash").innerText = cash; document.getElementById("hud-biz-bank").innerText = bizBank;
document.getElementById("hud-stock").innerText = stock; document.getElementById("hud-weapon").innerText = hasWeapon ? "Pistol" : "UNARMED";
document.getElementById("hud-ammo").innerText = ammo; document.getElementById("hud-mission").innerText = activeMission;
document.getElementById("hud-stars").innerText = stars > 0 ? "★".repeat(stars) : "CLEAR";
document.getElementById("hud-time").innerText = ${Math.floor(timeOfDayClock).toString().padStart(2,'0')}:${Math.floor((timeOfDayClock%1)*60).toString().padStart(2,'0')};
document.getElementById("hud-weather").innerText = currentWeather; document.getElementById("hud-fps").innerText = engine.getFps().toFixed(0);
scene.render();
});
window.addEventListener('resize', () => { engine.resize(); });
});
