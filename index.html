<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GTS: Stoner Valley - 3D Engine Build</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050b14; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #3dfc7b; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; pointer-events: none; background: rgba(10, 25, 15, 0.9); padding: 18px; border-radius: 8px; border: 2px solid #1fa347;
            z-index: 10;
        }
        .hud-line { margin-bottom: 5px; }
        #interact-prompt {
            position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); color: #fff; font-family: Arial, sans-serif;
            font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 20px; display: none;
            z-index: 10;
        }
    </style>
    <!-- Fixed Production CDN Script Links for Xbox Edge Compatibility -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="interact-prompt">A: INTERACT | B: HARVEST</div>
    <div id="hud">
        <div class="hud-line">💸 WALLET CASH: $<span id="hud-cash">5000</span></div>
        <div class="hud-line">🏦 BUSINESS BANK: $<span id="hud-biz-bank">15000</span></div>
        <div class="hud-line">🌿 RAW STOCK: <span id="hud-stock">100</span> / 500 oz</div>
        <div class="hud-line">🏪 DISPENSARY UPGRADES:</div>
        <div class="hud-line">&nbsp;&nbsp;• Grow Rows Active: <span id="hud-grows">0</span>/3</div>
        <div class="hud-line">&nbsp;&nbsp;• Automated Dispensers: <span id="hud-dispensers">0</span>/2</div>
        <div class="hud-line">🚓 WANTED LEVEL: <span id="hud-stars">CLEAR</span></div>
        <div class="hud-line">📦 MISSION: <span id="hud-mission">NONE</span></div>
        <div class="hud-line">⏰ TIME: <span id="hud-time">08:00</span> | <span id="hud-weather">CLEAR</span></div>
        <div class="hud-line">⚡ FPS: <span id="hud-fps">0</span></div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
    class SaveSystem {
        static save(data) {
            try { localStorage.setItem("GTS_WORLD_SAVE_DATA", JSON.stringify(data)); } catch (e) {}
        }
        static load() {
            try { const d = localStorage.getItem("GTS_WORLD_SAVE_DATA"); return d ? JSON.parse(d) : null; } catch(e) { return null; }
        }
    }

    class XboxInput {
        constructor() {
            this.gamepadIndex = null; this.deadzone = 0.20; this.axes =;
            this.buttons = { A: false, B: false, X: false, Y: false, LT: 0, RT: 0, Menu: false };
            this.prevButtons = { ...this.buttons };
            window.addEventListener("gamepadconnected", (e) => { this.gamepadIndex = e.gamepad.index; });
        }
        poll() {
            if (this.gamepadIndex === null) {
                const gps = navigator.getGamepads();
                for (let i = 0; i < gps.length; i++) { if (gps[i]) { this.gamepadIndex = i; break; } }
            }
            if (this.gamepadIndex === null) return;
            const gp = navigator.getGamepads()[this.gamepadIndex]; if (!gp) return;
            this.prevButtons = { ...this.buttons };
            if (gp.axes && gp.axes.length >= 2) {
                this.axes = [
                    Math.abs(gp.axes[0]) > this.deadzone ? gp.axes[0] : 0,
                    Math.abs(gp.axes[1]) > this.deadzone ? gp.axes[1] : 0
                ];
            }
            if (gp.buttons && gp.buttons.length >= 10) {
                this.buttons = {
                    A: gp.buttons[0].pressed, B: gp.buttons[1].pressed, X: gp.buttons[2].pressed, Y: gp.buttons[3].pressed,
                    LT: gp.buttons[6].value, RT: gp.buttons[7].value, Menu: gp.buttons[9].pressed
                };
            }
        }
        wasButtonPressed(b) { return this.buttons[b] && !this.prevButtons[b]; }
    }

    class VehicleController {
        constructor(mesh, type = "Sports") {
            this.mesh = mesh; this.type = type; this.velocity = BABYLON.Vector3.Zero(); this.speed = 0; this.heading = 0;
            this.maxSpeed = type === "Truck" ? 0.50 : 0.95;
            this.acceleration = type === "Truck" ? 0.009 : 0.026;
            this.deceleration = 0.006; this.brakingForce = 0.045; this.steeringSpeed = 0.048; this.driftFactor = type === "Truck" ? 0.98 : 0.91;
        }
        update(throttle, brake, steerX, isRainy) {
            const drift = Math.min(0.99, this.driftFactor + (isRainy ? 0.05 : 0));
            if (Math.abs(this.speed) > 0.03) { this.heading += steerX * this.steeringSpeed * (this.speed > 0 ? 1 : -1); this.mesh.rotation.y = this.heading; }
            if (throttle > 0.05) this.speed = Math.min(this.maxSpeed, this.speed + (throttle * this.acceleration));
            else if (brake > 0.05) this.speed = Math.max(-this.maxSpeed * 0.3, this.speed - (brake * this.brakingForce));
            else { if (this.speed > 0) this.speed = Math.max(0, this.speed - this.deceleration); if (this.speed < 0) this.speed = Math.min(0, this.speed + this.deceleration); }
            this.velocity = BABYLON.Vector3.Lerp(this.velocity, new BABYLON.Vector3(Math.sin(this.heading) * this.speed, 0, Math.cos(this.heading) * this.speed), drift);
            this.mesh.position.addInPlace(this.velocity);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('renderCanvas'); const engine = new BABYLON.Engine(canvas, true);
        let scene, camera, sunLight, skybox, skyboxMaterial, input = new XboxInput(), activeVehicle;
        let playerMesh, playerBody, playerHead, sportsCarMesh, deliveryTruckMesh, stateMode = "Walking", timeOfDayClock = 12.0;
        let currentWeather = "CLEAR", rainParticles = null, activeMission = "NONE", missionStage = 0, missionMarker = null;
        let cash = 5000, bizBank = 15000, stock = 100, stars = 0, cooldown = 0;
        
        let unlocks = { grows: 0, dispensers: 0 };
        let plantGrowth = [0.0, 0.0, 0.0]; let businessProcessingTimer = 0; let structures = [];
        const nodes = [new BABYLON.Vector3(-150,0,-150), new BABYLON.Vector3(150,0,150), new BABYLON.Vector3(0,0,90)];
        let trafficCars = [], copCars = [];

        const initGame = () => {
            scene = new BABYLON.Scene(engine);
            camera = new BABYLON.UniversalCamera("Cam", new BABYLON.Vector3(0, 18, -14), scene); camera.setTarget(BABYLON.Vector3.Zero());
            
            sunLight = new BABYLON.DirectionalLight("Sun", new BABYLON.Vector3(-0.5, -1, -0.3), scene); sunLight.position = new BABYLON.Vector3(50, 120, 50); sunLight.intensity = 1.8;
            const ambient = new BABYLON.HemisphericLight("Amb", new BABYLON.Vector3(0, 1, 0), scene); ambient.intensity = 0.6;

            // --- REAL SKYBOX LAYER ---
            skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size:1000.0}, scene);
            skyboxMaterial = new BABYLON.StandardMaterial("skyBoxMat", scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.disableLighting = true;
            skybox.material = skyboxMaterial;
            skybox.infiniteDistance = true;

            // --- WORLD LANDSCAPE GROUND & ROADS ---
            const ground = BABYLON.MeshBuilder.CreateGround("Floor", { width: 800, height: 800 }, scene);
            const grassMat = new BABYLON.StandardMaterial("grassMat", scene);
            grassMat.diffuseColor = new BABYLON.Color3(0.12, 0.35, 0.15);
            ground.material = grassMat; ground.receiveShadows = true;

            const mainStreetX = BABYLON.MeshBuilder.CreateGround("StreetX", { width: 800, height: 16 }, scene);
            mainStreetX.position.y = 0.01;
            const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
            roadMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.18);
            mainStreetX.material = roadMat; mainStreetX.receiveShadows = true;

            const mainStreetZ = BABYLON.MeshBuilder.CreateGround("StreetZ", { width: 16, height: 800 }, scene);
            mainStreetZ.position.y = 0.01; mainStreetZ.material = roadMat; mainStreetZ.receiveShadows = true;

            // --- 3D SKYLINE BUILDINGS ---
            for (let x = -250; x <= 250; x += 90) {
                for (let z = -250; z <= 250; z += 90) {
                    if (Math.abs(x) < 50 && Math.abs(z) < 50) continue;
                    const h = 30 + Math.random() * 45;
                    const b = BABYLON.MeshBuilder.CreateBox("Bld", { width: 32, depth: 32, height: h }, scene); b.position = new BABYLON.Vector3(x, h / 2, z);
                    const bMat = new BABYLON.StandardMaterial("bMat", scene);
                    bMat.diffuseColor = new BABYLON.Color3(0.25, 0.28, 0.35);
                    b.material = bMat;
                }
            }

            // HQ Building Block
            const hq = BABYLON.MeshBuilder.CreateBox("HQ", { width: 38, depth: 38, height: 10 }, scene); hq.position = new BABYLON.Vector3(0, 5, 0);
            const hqMat = new BABYLON.StandardMaterial("hqMat", scene); hqMat.diffuseColor = new BABYLON.Color3(0.05, 0.25, 0.12); hq.material = hqMat;
            
            const entranceGlow = BABYLON.MeshBuilder.CreateCylinder("Portal", { diameter: 4.5, height: 0.15 }, scene); entranceGlow.position = new BABYLON.Vector3(0, 0.08, -19.2);
            const entranceMat = new BABYLON.StandardMaterial("eMat", scene); entranceMat.emissiveColor = new BABYLON.Color3(0.0, 1.0, 0.4); entranceGlow.material = entranceMat;

            // --- PLAYER CHARACTER AVATAR ---
            playerMesh = new BABYLON.Mesh("PlayerRoot", scene);
playerMesh.position = new BABYLON.Vector3(0, 0, -24);
playerBody = BABYLON.MeshBuilder.CreateCylinder("PlayerBody", { diameter: 1.4, height: 2.2 }, scene);
playerBody.position.y = 1.1; playerBody.parent = playerMesh;
const bodyMat = new BABYLON.StandardMaterial("bMat", scene); bodyMat.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.9); playerBody.material = bodyMat;
playerHead = BABYLON.MeshBuilder.CreateSphere("PlayerHead", { diameter: 1.1 }, scene);
playerHead.position.y = 2.5; playerHead.parent = playerMesh;
const headMat = new BABYLON.StandardMaterial("hMat", scene); headMat.diffuseColor = new BABYLON.Color3(0.95, 0.75, 0.6); playerHead.material = headMat;
// --- VEHICLES ---
sportsCarMesh = BABYLON.MeshBuilder.CreateBox("SportsCar", { width: 2.4, depth: 4.8, height: 1.3 }, scene); sportsCarMesh.position = new BABYLON.Vector3(12, 0.65, -24);
const scMat = new BABYLON.StandardMaterial("scMat", scene); scMat.diffuseColor = new BABYLON.Color3(0.9, 0.05, 0.05); sportsCarMesh.material = scMat;
deliveryTruckMesh = BABYLON.MeshBuilder.CreateBox("TruckMesh", { width: 3.0, depth: 7.0, height: 2.8 }, scene); deliveryTruckMesh.position = new BABYLON.Vector3(-14, 1.4, -26);
const tMat = new BABYLON.StandardMaterial("tMat", scene); tMat.diffuseColor = new BABYLON.Color3(0.4, 0.45, 0.42); deliveryTruckMesh.material = tMat;
activeVehicle = new VehicleController(sportsCarMesh, "Sports");
// Traffic & Cops
for(let i=0; i<6; i++) {
let car = BABYLON.MeshBuilder.CreateBox("CivCar", {width:2.2, depth:4.4, height:1.4}, scene); car.position = new BABYLON.Vector3(Math.random()*300-150, 0.7, Math.random()*300-150);
let cMat = new BABYLON.StandardMaterial("c", scene); cMat.diffuseColor = new BABYLON.Color3(0.3,0.3,0.3); car.material = cMat; trafficCars.push(car);
}
for(let i=0; i<3; i++) {
let cop = BABYLON.MeshBuilder.CreateBox("CopCar", {width:2.4, depth:4.8, height:1.6}, scene); cop.position = new BABYLON.Vector3(300, 0.8, 300); cop.setEnabled(false);
let copMat = new BABYLON.StandardMaterial("cop", scene); copMat.diffuseColor = new BABYLON.Color3(0.05,0.05,0.1); cop.material = copMat; copCars.push({mesh:cop, active:false});
}
// Weather Systems
rainParticles = new BABYLON.ParticleSystem("Rain", 80, scene);
rainParticles.emitter = new BABYLON.Vector3(0, 25, 0); rainParticles.minEmitBox = new BABYLON.Vector3(-25, 0, -25); rainParticles.maxEmitBox = new BABYLON.Vector3(25, 0, 25);
rainParticles.color1 = new BABYLON.Color4(0.5, 0.7, 1.0, 0.3); rainParticles.gravity = new BABYLON.Vector3(0, -18, 0); rainParticles.emitRate = 0; rainParticles.start();
const saved = SaveSystem.load();
if (saved) {
cash = saved.cash || 5000; bizBank = saved.bizBank || 15000; stock = saved.stock || 100;
unlocks = saved.unlocks || { grows: 0, dispensers: 0 };
rebuildDispensaryInterior();
}
};
const isInsideHQ = (pos) => { return (pos.x >= -19 && pos.x <= 19 && pos.z >= -19 && pos.z <= 19); };
const rebuildDispensaryInterior = () => {
structures.forEach(s => s.dispose()); structures = [];
if (stateMode !== "Interior") return;
// Grow House Setup Inside HQ
for (let i = 0; i < unlocks.grows; i++) {
let growBox = BABYLON.MeshBuilder.CreateBox("GrowRow_"+i, {width: 12, depth: 3, height: 0.5}, scene);
growBox.position = new BABYLON.Vector3(-10, 0.25, 10 - (i * 6));
let gMat = new BABYLON.StandardMaterial("gMat"+i, scene); gMat.diffuseColor = new BABYLON.Color3(0.2, 0.3, 0.2); growBox.material = gMat;
structures.push(growBox);
let p = BABYLON.MeshBuilder.CreateCylinder("PlantBud_"+i, {diameterTop: 0.9, diameterBottom: 0.3, height: Math.max(0.1, plantGrowth[i] * 2.5)}, scene);
p.position = new BABYLON.Vector3(-10, (plantGrowth[i] * 1.25) + 0.25, 10 - (i * 6));
let pMat = new BABYLON.StandardMaterial("pMat"+i, scene); pMat.emissiveColor = new BABYLON.Color3(0.1, 0.4 + (plantGrowth[i] * 0.6), 0.1); p.material = pMat;
structures.push(p);
}
// Dispensers Inside HQ
for (let i = 0; i < unlocks.dispensers; i++) {
let disp = BABYLON.MeshBuilder.CreateBox("Dispenser_"+i, {width: 3, depth: 3, height: 5}, scene);
disp.position = new BABYLON.Vector3(12, 2.5, 8 - (i * 7));
let dMat = new BABYLON.StandardMaterial("dMat"+i, scene); dMat.emissiveColor = new BABYLON.Color3(0.2, 0.8, 0.4); disp.material = dMat;
structures.push(disp);
}
};
initGame();
engine.runRenderLoop(() => {
input.poll();
timeOfDayClock = (timeOfDayClock + 0.0025) % 24;
// Skybox engine transitions
if (timeOfDayClock >= 6 && timeOfDayClock < 18) {
skyboxMaterial.emissiveColor = new BABYLON.Color3(0.4, 0.6, 0.9);
sunLight.intensity = 1.8;
} else {
skyboxMaterial.emissiveColor = new BABYLON.Color3(0.02, 0.04, 0.08);
sunLight.intensity = 0.3;
}
if (Math.random() < 0.001) { currentWeather = currentWeather === "CLEAR" ? "RAIN" : "CLEAR"; rainParticles.emitRate = currentWeather === "RAIN" ? 120 : 0; }
const currentPos = stateMode === "Driving" ? activeVehicle.mesh.position : playerMesh.position;
rainParticles.emitter.copyFrom(currentPos).addInPlace(new BABYLON.Vector3(0, 18, 0));
// Cop Pursuit Tracker Loop
if (cooldown > 0) { cooldown--; if(cooldown === 0 && stars > 0) { stars--; if(stars > 0) cooldown = 500; } }
copCars.forEach((cop, idx) => {
if(!cop.active && idx < stars) { cop.mesh.setEnabled(true); cop.active = true; cop.mesh.position.copyFrom(currentPos).addInPlace(new BABYLON.Vector3(0,0,65)); }
else if(cop.active && idx >= stars) { cop.mesh.setEnabled(false); cop.active = false; }
if(cop.active) {
let dir = currentPos.subtract(cop.mesh.position); dir.normalize();
cop.mesh.rotation.y = Math.atan2(dir.x, dir.z); cop.mesh.position.addInPlace(dir.scale(0.34));
if(stateMode === "Driving" && BABYLON.Vector3.Distance(cop.mesh.position, activeVehicle.mesh.position) < 4.0) { stars = Math.min(5, stars + 1); cooldown = 500; }
}
});
// Street Traffic Loop
trafficCars.forEach(car => {
car.position.z += 0.22; if (car.position.z > 300) car.position.z = -300;
if(stateMode === "Driving" && BABYLON.Vector3.Distance(activeVehicle.mesh.position, car.position) < 4.2) { if(stars === 0) { stars = 1; cooldown = 500; } }
});
// Greenhouse Processing Tick
if (stateMode === "Interior") {
for(let i=0; i<unlocks.grows; i++) { if(plantGrowth[i] < 1.0) plantGrowth[i] += 0.0015; }
businessProcessingTimer++;
if (businessProcessingTimer >= 140) {
businessProcessingTimer = 0;
if (unlocks.dispensers > 0 && stock > 0) {
let amountSold = unlocks.dispensers * 2;
if (stock >= amountSold) { stock -= amountSold; bizBank += (amountSold * 95); }
}
rebuildDispensaryInterior();
}
}
// Open World Missions Tracking
if (activeMission !== "NONE" && missionMarker) {
if (BABYLON.Vector3.Distance(currentPos, missionMarker.position) < 5.0) {
if (missionStage === 1) { missionStage = 2; missionMarker.position.copyFrom(new BABYLON.Vector3(0, 0.1, -19)); }
else if (missionStage === 2) { bizBank += 4500; stock = Math.min(500, stock + 120); activeMission = "NONE"; missionMarker.dispose(); missionMarker = null; }
}
}
// Input Handling (Entering/Exiting Cars)
if (input.wasButtonPressed("Y")) {
if (stateMode === "Walking") {
if (BABYLON.Vector3.Distance(playerMesh.position, sportsCarMesh.position) < 5.0) { stateMode = "Driving"; activeVehicle = new VehicleController(sportsCarMesh, "Sports"); playerMesh.setEnabled(false); }
else if (BABYLON.Vector3.Distance(playerMesh.position, deliveryTruckMesh.position) < 6.0) { stateMode = "Driving"; activeVehicle = new VehicleController(deliveryTruckMesh, "Truck"); playerMesh.setEnabled(false); }
} else if (stateMode === "Driving") { stateMode = "Walking"; playerMesh.position.copyFrom(activeVehicle.mesh.position).addInPlace(new BABYLON.Vector3(-4, 0.5, 0)); playerMesh.setEnabled(true); }
}
const prompt = document.getElementById("interact-prompt");
if (stateMode === "Interior") { prompt.style.display = "block"; prompt.innerText = "A: BUY UPGRADES | B: HARVEST CROPS"; } else { prompt.style.display = "none"; }
if (input.wasButtonPressed("A") && stateMode === "Interior") {
if (unlocks.grows < 3 && bizBank >= 2000) { bizBank -= 2000; unlocks.grows++; rebuildDispensaryInterior(); }
else if (unlocks.dispensers < 2 && bizBank >= 4000) { bizBank -= 4000; unlocks.dispensers++; rebuildDispensaryInterior(); }
}
if (input.wasButtonPressed("B") && stateMode === "Interior") {
for (let i = 0; i < unlocks.grows; i++) { if (plantGrowth[i] >= 0.8) { plantGrowth[i] = 0.0; stock = Math.min(500, stock + 50); } }
rebuildDispensaryInterior();
}
if (input.wasButtonPressed("X") && stateMode === "Walking" && activeMission === "NONE") {
activeMission = "SMUGGLE RUN"; missionStage = 1;
missionMarker = BABYLON.MeshBuilder.CreateCylinder("Marker", {diameter:5, height:0.2}, scene);
missionMarker.position.copyFrom(nodes[Math.floor(Math.random() * nodes.length)]);
let m = new BABYLON.StandardMaterial("m", scene); m.emissiveColor = new BABYLON.Color3(0.9,0.1,0.1); missionMarker.material = m;
}
if (input.wasButtonPressed("Menu")) { SaveSystem.save({ cash, bizBank, stock, unlocks }); }
// Movement Axis Core Calculations
const horizontalAxis = (input.axes && input.axes.length >= 2) ? input.axes[0] : 0;
const verticalAxis = (input.axes && input.axes.length >= 2) ? input.axes[1] : 0;
if (stateMode === "Walking") {
playerMesh.position.x += horizontalAxis * 0.18; playerMesh.position.z += -verticalAxis * 0.18;
if (Math.abs(horizontalAxis) > 0.1 || Math.abs(verticalAxis) > 0.1) {
playerMesh.rotation.y = Math.atan2(horizontalAxis, -verticalAxis);
}
camera.position.x = playerMesh.position.x; camera.position.z = playerMesh.position.z - 15;
if (isInsideHQ(playerMesh.position)) { stateMode = "Interior"; rebuildDispensaryInterior(); }
} else if (stateMode === "Interior") {
playerMesh.position.x += horizontalAxis * 0.12; playerMesh.position.z += -verticalAxis * 0.12;
if (Math.abs(horizontalAxis) > 0.1 || Math.abs(verticalAxis) > 0.1) {
playerMesh.rotation.y = Math.atan2(horizontalAxis, -verticalAxis);
}
camera.position.x = playerMesh.position.x; camera.position.z = playerMesh.position.z - 15;
if (!isInsideHQ(playerMesh.position)) { stateMode = "Walking"; rebuildDispensaryInterior(); }
} else if (stateMode === "Driving") {
activeVehicle.update(input.buttons.RT, input.buttons.LT, horizontalAxis, currentWeather === "RAIN");
camera.position.x = activeVehicle.mesh.position.x; camera.position.z = activeVehicle.mesh.position.z - 18;
}
// HUD Sync Update Loop
document.getElementById("hud-cash").innerText = cash; document.getElementById("hud-biz-bank").innerText = bizBank;
document.getElementById("hud-stock").innerText = stock; document.getElementById("hud-grows").innerText = unlocks.grows;
document.getElementById("hud-dispensers").innerText = unlocks.dispensers; document.getElementById("hud-mission").innerText = activeMission;
document.getElementById("hud-stars").innerText = stars > 0 ? "★".repeat(stars) : "CLEAR";
document.getElementById("hud-time").innerText = ${Math.floor(timeOfDayClock).toString().padStart(2,'0')}:${Math.floor((timeOfDayClock%1)*60).toString().padStart(2,'0')};
document.getElementById("hud-weather").innerText = currentWeather; document.getElementById("hud-fps").innerText = engine.getFps().toFixed(0);
scene.render();
});
window.addEventListener('resize', () => { engine.resize(); });
});
